<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Orthographic drawing of a flanged bearing housing</title>
  <desc id="desc">A detailed front, top, and sectioned right-side view of a bearing housing with dimensions, centerlines, hidden geometry, hatching, feature callouts, and a technical title block.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#132a42"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d7e2e8" stroke-width="0.7" opacity=".44"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#54758b" stroke-width="1.5"/>
    </pattern>
    <marker id="dimArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0 4.5L9 0L7 4.5L9 9Z" fill="#177ea5"/>
    </marker>
    <marker id="leaderArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#177ea5"/>
    </marker>
    <style>
      .obj{fill:none;stroke:#142532;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .heavy{fill:none;stroke:#0b1d2a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#486477;stroke-width:1.25}
      .hidden{fill:none;stroke:#557284;stroke-width:1.35;stroke-dasharray:8 5}
      .center{fill:none;stroke:#17a5c8;stroke-width:1.3;stroke-dasharray:18 6 3 6}
      .dim{fill:none;stroke:#177ea5;stroke-width:1.3;marker-start:url(#dimArrow);marker-end:url(#dimArrow)}
      .ext{fill:none;stroke:#177ea5;stroke-width:1}
      .leader{fill:none;stroke:#177ea5;stroke-width:1.35;marker-end:url(#leaderArrow)}
      .label{font:700 15px "Segoe UI",Arial,sans-serif;letter-spacing:1.8px;fill:#2a4658}
      .note{font:13px "Segoe UI",Arial,sans-serif;fill:#36566a}
      .dimension{font:14px "Segoe UI",Arial,sans-serif;fill:#126d91}
      .mono{font:12px Consolas,"Courier New",monospace;fill:#2c5368}
    </style>
  </defs>

  <rect width="1600" height="960" rx="30" fill="url(#frame)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="58" y="53" fill="#f4fbff" font-size="27" font-weight="700">A real drawing is more than primitives</text>
    <text x="58" y="82" fill="#9db4c8" font-size="15">Orthographic geometry · section logic · true dimensions · feature relationships · validation evidence</text>
    <g transform="translate(1180 30)">
      <rect width="360" height="48" rx="24" fill="#0e2133" stroke="#2e5672"/>
      <circle cx="24" cy="24" r="6" fill="#65d1ff"/>
      <text x="42" y="30" fill="#bfeaff" font-size="14" font-weight="700">BEARING HOUSING · DEMO PART</text>
    </g>
  </g>

  <rect x="38" y="105" width="1524" height="817" rx="12" fill="#f7fafb" stroke="#27485d" stroke-width="2"/>
  <rect x="55" y="122" width="1490" height="783" fill="url(#grid)" stroke="#6a8290" stroke-width="1"/>

