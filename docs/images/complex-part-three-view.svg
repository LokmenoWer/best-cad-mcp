    <path class="dim" d="M119 589H638"/>
    <rect x="361" y="577" width="34" height="20" fill="#f7fafb"/>
    <text class="dimension" x="378" y="592" text-anchor="middle">270</text>
    <path class="ext" d="M103 214H71M103 558H71"/>
    <path class="dim" d="M80 221V551"/>
    <rect x="67" y="374" width="26" height="40" fill="#f7fafb"/>
    <text class="dimension" x="80" y="399" text-anchor="middle" transform="rotate(-90 80 399)">165</text>
    <path class="leader" d="M512 234L474 258L456 275"/>
    <text class="dimension" x="515" y="229">4× Ø14 THRU · 100 PCD</text>
    <path class="leader" d="M522 318L474 334L431 344"/>
    <text class="dimension" x="525" y="313">Ø70 H7 BEARING SEAT</text>
    <path class="leader" d="M253 226L284 247L294 264"/>
    <text class="dimension" x="147" y="219">Ø140 FLANGE</text>
    <g class="thin">
      <path d="M378 188V176M367 188H389"/>
      <path d="M378 514V534"/>
    </g>
    <text class="note" x="361" y="171">A</text>
    <text class="note" x="361" y="548">A</text>
  </g>

