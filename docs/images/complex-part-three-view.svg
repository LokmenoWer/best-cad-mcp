  <g aria-label="sectioned right view">
    <text class="label" x="790" y="157">RIGHT-SIDE SECTION A—A</text>
    <text class="note" x="790" y="178">Stepped bore, shoulder, wall thickness, and mounting interface</text>

    <path class="heavy" d="M814 514H1463V558H814Z"/>
    <path d="M910 514L956 430H1002L978 514ZM1365 514L1319 430H1273L1297 514Z" fill="url(#hatch)" stroke="#142532" stroke-width="2.2"/>
