  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(790 628)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="673" height="230" fill="#f9fbfc" stroke="#142532" stroke-width="2.2"/>
    <path class="thin" d="M0 42H673M0 106H673M0 164H673M420 42V230M536 42V164M0 199H420M210 164V230"/>
    <text x="18" y="27" fill="#163144" font-size="16" font-weight="800" letter-spacing="1.5">FEATURE-RICH CAD SAMPLE</text>
    <rect x="545" y="12" width="112" height="20" rx="10" fill="#e7f4fa" stroke="#4f9fbe"/>
    <circle cx="559" cy="22" r="4" fill="#369bc3"/>
    <text x="570" y="26" fill="#27647c" font-size="11" font-weight="700">REFERENCE</text>
    <text x="18" y="66" fill="#486477" font-size="10" font-weight="700">PART NAME</text>
    <text x="18" y="93" fill="#102838" font-size="22" font-weight="800">FLANGED BEARING HOUSING</text>
    <text x="436" y="65" fill="#486477" font-size="10" font-weight="700">DRAWING</text>
    <text x="436" y="91" fill="#102838" font-size="13" font-weight="700">MCP-DEMO-017</text>
    <text x="551" y="65" fill="#486477" font-size="10" font-weight="700">REVISION</text>
    <text x="551" y="91" fill="#102838" font-size="17" font-weight="700">A</text>
    <text x="18" y="127" fill="#486477" font-size="10" font-weight="700">MATERIAL</text>
    <text x="18" y="151" fill="#173447" font-size="14" font-weight="700">DUCTILE IRON · QT500-7</text>
    <text x="436" y="127" fill="#486477" font-size="10" font-weight="700">SCALE</text>
    <text x="436" y="151" fill="#173447" font-size="14" font-weight="700">1 : 2</text>
    <text x="551" y="127" fill="#486477" font-size="10" font-weight="700">UNITS</text>
    <text x="551" y="151" fill="#173447" font-size="14" font-weight="700">mm</text>
    <text x="18" y="184" fill="#486477" font-size="10" font-weight="700">GENERAL TOLERANCE</text>
    <text x="222" y="184" fill="#486477" font-size="10" font-weight="700">PROJECTION</text>
    <text x="18" y="221" fill="#173447" font-size="13" font-weight="700">ISO 2768-mK</text>
    <text x="222" y="221" fill="#173447" font-size="13" font-weight="700">THIRD ANGLE</text>
    <g transform="translate(478 183)" fill="none" stroke="#173447" stroke-width="1.6">
