    <text class="note" x="90" y="656">Projected alignment · base slots and rib envelope</text>
    <path class="heavy" d="M112 679H645V841H112Z"/>
    <path class="obj" d="M244 696H512V824H244Z"/>
    <path class="obj" d="M277 679V841M479 679V841"/>
