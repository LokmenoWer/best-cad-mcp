  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="63" y="884" width="510" height="18" rx="9" fill="#e8f1f5"/>
    <circle cx="78" cy="893" r="4" fill="#142532"/>
    <text x="90" y="898" fill="#3b5b6d" font-size="11">VISIBLE</text>
    <path d="M155 893H191" stroke="#557284" stroke-width="1.4" stroke-dasharray="7 4"/>
