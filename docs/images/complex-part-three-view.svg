    <path class="hidden" d="M876 521V551M1401 521V551M1005 220V496M1271 220V496"/>
    <path class="center" d="M878 367H1398"/>
    <g class="thin">
      <path d="M944 277H1332M944 495H1332"/>
      <path d="M1058 351V383M1218 351V383"/>
    </g>

    <!-- section dimensions -->
    <path class="ext" d="M909 311V199M1367 311V199"/>
    <path class="dim" d="M916 205H1360"/>
    <rect x="1120" y="194" width="36" height="20" fill="#f7fafb"/>
    <text class="dimension" x="1138" y="209" text-anchor="middle">115</text>
    <path class="ext" d="M1377 220H1419M1377 514H1419"/>
    <path class="dim" d="M1410 227V507"/>
    <rect x="1397" y="347" width="26" height="40" fill="#f7fafb"/>
    <text class="dimension" x="1410" y="372" text-anchor="middle" transform="rotate(-90 1410 372)">165</text>
    <path class="leader" d="M1164 242L1145 270L1142 325"/>
    <text class="dimension" x="1168" y="238">R6 INTERNAL FILLET</text>
    <path class="leader" d="M1022 445L1058 420L1086 393"/>
    <text class="dimension" x="844" y="449">Ø80 × 12 SHOULDER</text>
    <path class="leader" d="M1243 458L1267 439L1285 406"/>
    <text class="dimension" x="1246" y="455">6 WALL MIN</text>
  </g>

