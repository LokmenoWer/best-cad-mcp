    <circle class="obj" cx="378" cy="351" r="113"/>
    <circle class="hidden" cx="378" cy="351" r="66"/>
    <circle class="heavy" cx="378" cy="351" r="51"/>
    <g class="obj">
      <circle cx="307" cy="280" r="10"/>
      <circle cx="449" cy="280" r="10"/>
      <circle cx="307" cy="422" r="10"/>
      <circle cx="449" cy="422" r="10"/>
      <path d="M145 529a12 8 0 1 0 24 0a12 8 0 1 0-24 0M587 529a12 8 0 1 0 24 0a12 8 0 1 0-24 0"/>
