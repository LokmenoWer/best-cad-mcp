<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">What a VLM returns after understanding a mechanical drawing</title>
  <desc id="desc">A clean CAD export with visual evidence is transformed into an ImageDrawingSpec containing features, geometry, annotations, relations, confidence, and uncertainties, then grounded to semantic objects and exact AutoCAD handles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#18314b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="flowArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#65d1ff"/>
    </marker>
    <style>
      .ui{font-family:"Segoe UI",Arial,sans-serif}
      .mono{font-family:Consolas,"Courier New",monospace}
      .obj{fill:none;stroke:#172b39;stroke-width:2.4;stroke-linejoin:round}
      .center{fill:none;stroke:#17a5c8;stroke-width:1.2;stroke-dasharray:15 5 3 5}
      .hidden{fill:none;stroke:#637b8b;stroke-width:1.2;stroke-dasharray:7 5}
    </style>
  </defs>

  <rect width="1600" height="820" rx="30" fill="url(#bg)"/>
  <g class="ui">
    <text x="58" y="61" fill="#f5fbff" font-size="29" font-weight="750">VLM understanding becomes inspectable CAD evidence</text>
    <text x="58" y="94" fill="#9db5c9" font-size="16">The model returns a typed contract—not a vague caption—and every important claim carries location, confidence, and uncertainty.</text>
    <g transform="translate(1262 37)">
      <rect width="278" height="43" rx="21.5" fill="#10283d" stroke="#31546c"/>
      <circle cx="23" cy="21.5" r="6" fill="#72e0a8"/>
      <text x="40" y="27" fill="#bcebd2" font-size="13" font-weight="700">READ-ONLY UNDERSTANDING</text>
    </g>
  </g>

  <!-- observed image -->
  <g transform="translate(55 132)" filter="url(#shadow)">
    <rect width="440" height="548" rx="22" fill="#f8fbfc" stroke="#45677d" stroke-width="2"/>
    <g class="ui">
      <text x="26" y="39" fill="#173145" font-size="17" font-weight="800">1 · EXPORTED VIEW + OVERLAY</text>
      <text x="26" y="64" fill="#587184" font-size="13">Pixels are evidence; overlay IDs are stable pointers.</text>
    </g>
    <rect x="26" y="86" width="388" height="350" rx="14" fill="#fff" stroke="#c6d4dc"/>
    <g transform="translate(44 112)">
      <path class="obj" d="M22 258H348V288H22ZM52 258V241H95L126 205M318 258V241H275L244 205"/>
      <path class="obj" d="M95 258L129 203L153 221L123 258M275 258L241 203L217 221L247 258"/>
      <circle class="obj" cx="185" cy="151" r="92"/>
      <circle class="obj" cx="185" cy="151" r="75"/>
      <circle class="hidden" cx="185" cy="151" r="46"/>
      <circle class="obj" cx="185" cy="151" r="34"/>
      <g class="obj">
        <circle cx="138" cy="104" r="7"/>
        <circle cx="232" cy="104" r="7"/>
        <circle cx="138" cy="198" r="7"/>
        <circle cx="232" cy="198" r="7"/>
        <path d="M46 272H72M298 272H324"/>
      </g>
      <path class="center" d="M70 151H300M185 42V272"/>
      <rect x="103" y="69" width="164" height="164" rx="8" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 5"/>
      <rect x="142" y="108" width="86" height="86" rx="6" fill="none" stroke="#65d1ff" stroke-width="2.5"/>
      <rect x="22" y="238" width="326" height="51" rx="5" fill="none" stroke="#72e0a8" stroke-width="2.5"/>
      <g class="ui" font-size="11" font-weight="800" text-anchor="middle">
        <g transform="translate(111 77)"><circle r="15" fill="#ffd166"/><text y="4" fill="#10202b">83</text></g>
        <g transform="translate(150 116)"><circle r="15" fill="#65d1ff"/><text y="4" fill="#10202b">91</text></g>
        <g transform="translate(31 247)"><circle r="15" fill="#72e0a8"/><text y="4" fill="#10202b">104</text></g>
      </g>
    </g>
    <g class="ui">
      <rect x="26" y="458" width="388" height="66" rx="12" fill="#edf4f7"/>
      <circle cx="45" cy="478" r="5" fill="#ffd166"/><text x="58" y="483" fill="#415f72" font-size="12">83 · flange profile</text>
      <circle cx="207" cy="478" r="5" fill="#65d1ff"/><text x="220" y="483" fill="#415f72" font-size="12">91 · stepped bore</text>
      <circle cx="45" cy="505" r="5" fill="#72e0a8"/><text x="58" y="510" fill="#415f72" font-size="12">104 · mounting base</text>
      <text x="26" y="543" fill="#6d8290" font-size="11">snapshot_id: view_01 · overlay_schema: v2</text>
    </g>
  </g>

  <path d="M507 405H545" fill="none" stroke="#65d1ff" stroke-width="3" marker-end="url(#flowArrow)"/>

  <!-- returned contract -->
  <g transform="translate(557 132)" filter="url(#shadow)">
    <rect width="488" height="548" rx="22" fill="#0b1724" stroke="#4f88a8" stroke-width="2"/>
    <g class="ui">
      <text x="25" y="39" fill="#f3fbff" font-size="17" font-weight="800">2 · VLM RETURN · ImageDrawingSpec/v1</text>
      <text x="25" y="64" fill="#91a9bb" font-size="13">Schema-valid contract (abridged): observations, relations, and doubt.</text>
    </g>
    <g class="mono" font-size="12.5">
      <text x="25" y="104" fill="#d7e8f3">{</text>
      <text x="43" y="128"><tspan fill="#75d6ff">"domain"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#a9e5bf">"mechanical"</tspan><tspan fill="#d7e8f3">,</tspan></text>
      <text x="43" y="152"><tspan fill="#75d6ff">"units"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#a9e5bf">"mm"</tspan><tspan fill="#d7e8f3">,</tspan></text>
      <text x="43" y="176"><tspan fill="#75d6ff">"features"</tspan><tspan fill="#d7e8f3">: [</tspan></text>
      <text x="62" y="200" fill="#d7e8f3">{ <tspan fill="#75d6ff">"kind"</tspan>: <tspan fill="#a9e5bf">"stepped_bore"</tspan>,</text>
      <text x="78" y="222"><tspan fill="#75d6ff">"pixel_bbox"</tspan><tspan fill="#d7e8f3">: [142,108,228,194],</tspan></text>
      <text x="78" y="244"><tspan fill="#75d6ff">"diameter"</tspan><tspan fill="#d7e8f3">: 70, </tspan><tspan fill="#75d6ff">"confidence"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#ffd166">0.97</tspan><tspan fill="#d7e8f3"> },</tspan></text>
      <text x="62" y="270" fill="#d7e8f3">{ <tspan fill="#75d6ff">"kind"</tspan>: <tspan fill="#a9e5bf">"hole_pattern"</tspan>,</text>
      <text x="78" y="292"><tspan fill="#75d6ff">"count"</tspan><tspan fill="#d7e8f3">: 4, </tspan><tspan fill="#75d6ff">"pcd"</tspan><tspan fill="#d7e8f3">: 100, </tspan><tspan fill="#75d6ff">"confidence"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#ffd166">0.94</tspan><tspan fill="#d7e8f3"> }</tspan></text>
      <text x="43" y="316" fill="#d7e8f3">],</text>
      <text x="43" y="342"><tspan fill="#75d6ff">"relations"</tspan><tspan fill="#d7e8f3">: [</tspan></text>
      <text x="62" y="364" fill="#a9e5bf">"concentric(bore, flange)"<tspan fill="#d7e8f3">,</tspan></text>
      <text x="62" y="386" fill="#a9e5bf">"pattern(holes, polar, 4)"<tspan fill="#d7e8f3">,</tspan></text>
      <text x="62" y="408" fill="#a9e5bf">"symmetric(base, center_axis)"</text>
      <text x="43" y="430" fill="#d7e8f3">],</text>
      <text x="43" y="456"><tspan fill="#75d6ff">"uncertainties"</tspan><tspan fill="#d7e8f3">: [{</tspan></text>
      <text x="62" y="478"><tspan fill="#75d6ff">"kind"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#ff9f7a">"fit_text"</tspan><tspan fill="#d7e8f3">, </tspan><tspan fill="#75d6ff">"confidence"</tspan><tspan fill="#d7e8f3">: </tspan><tspan fill="#ff9f7a">0.61</tspan></text>
      <text x="43" y="500" fill="#d7e8f3">}]</text>
      <text x="25" y="524" fill="#d7e8f3">}</text>
    </g>
  </g>

  <path d="M1057 405H1095" fill="none" stroke="#65d1ff" stroke-width="3" marker-end="url(#flowArrow)"/>

  <!-- semantic grounding -->
  <g transform="translate(1107 132)" filter="url(#shadow)">
    <rect width="438" height="548" rx="22" fill="#102238" stroke="#426d8a" stroke-width="2"/>
    <g class="ui">
      <text x="24" y="39" fill="#f3fbff" font-size="17" font-weight="800">3 · GROUND + EXPLAIN</text>
      <text x="24" y="64" fill="#91a9bb" font-size="13">Claims resolve to candidates before any edit.</text>
    </g>
    <g class="ui" font-size="12" text-anchor="middle">
      <path d="M219 144L104 220M219 144L334 220M104 220L92 337M104 220L213 337M334 220L213 337M334 220L346 337" fill="none" stroke="#3e6884" stroke-width="2"/>
      <path d="M92 337L219 445M213 337L219 445M346 337L219 445" fill="none" stroke="#3e6884" stroke-width="2"/>
      <g transform="translate(219 130)">
        <rect x="-83" y="-25" width="166" height="50" rx="25" fill="#173d58" stroke="#65d1ff"/>
        <text y="-2" fill="#dff6ff" font-weight="800">BEARING HOUSING</text>
        <text y="15" fill="#8ecbe3" font-size="10">semantic object</text>
      </g>
      <g transform="translate(104 220)">
        <rect x="-60" y="-23" width="120" height="46" rx="18" fill="#1a3b43" stroke="#72e0a8"/>
        <text y="4" fill="#d9f6e6" font-weight="700">BASE · 104</text>
      </g>
      <g transform="translate(334 220)">
        <rect x="-66" y="-23" width="132" height="46" rx="18" fill="#3b3421" stroke="#ffd166"/>
        <text y="4" fill="#fff0bd" font-weight="700">FLANGE · 83</text>
      </g>
      <g transform="translate(92 337)">
        <rect x="-58" y="-22" width="116" height="44" rx="17" fill="#26364b" stroke="#80a9ff"/>
        <text y="4" fill="#dce8ff" font-weight="700">SLOT × 4</text>
      </g>
      <g transform="translate(213 337)">
        <rect x="-55" y="-22" width="110" height="44" rx="17" fill="#173d58" stroke="#65d1ff"/>
        <text y="4" fill="#dff6ff" font-weight="700">BORE · 91</text>
      </g>
      <g transform="translate(346 337)">
        <rect x="-57" y="-22" width="114" height="44" rx="17" fill="#3a2630" stroke="#ff9f7a"/>
        <text y="4" fill="#ffe2d9" font-weight="700">FIT · 0.61</text>
      </g>
      <g transform="translate(219 445)">
        <rect x="-113" y="-31" width="226" height="62" rx="20" fill="#132e45" stroke="#72e0a8" stroke-width="2"/>
        <text y="-6" fill="#daf5e6" font-size="13" font-weight="800">EXACT HANDLE CANDIDATES</text>
        <text y="15" fill="#9acdb1" font-family="Consolas,monospace">["2AF", "2B1", "2B8"]</text>
      </g>
    </g>
    <g class="ui">
      <rect x="24" y="498" width="390" height="29" rx="14.5" fill="#0b1928" stroke="#294d68"/>
      <text x="219" y="518" text-anchor="middle" fill="#9edfff" font-size="12">ground_vlm_region → explain_entity → confirmed target</text>
    </g>
  </g>

  <g class="ui" transform="translate(210 723)">
    <rect width="1180" height="55" rx="27.5" fill="#0b1928" stroke="#31536c"/>
    <g transform="translate(25 14)"><rect width="143" height="27" rx="13.5" fill="#18334a"/><circle cx="16" cy="13.5" r="5" fill="#65d1ff"/><text x="28" y="18" fill="#c9efff" font-size="12" font-weight="700">OBSERVED</text></g>
    <g transform="translate(182 14)"><rect width="137" height="27" rx="13.5" fill="#273329"/><circle cx="16" cy="13.5" r="5" fill="#72e0a8"/><text x="28" y="18" fill="#d6f4e2" font-size="12" font-weight="700">INFERRED</text></g>
    <g transform="translate(333 14)"><rect width="145" height="27" rx="13.5" fill="#3d3021"/><circle cx="16" cy="13.5" r="5" fill="#ffd166"/><text x="28" y="18" fill="#fff0bd" font-size="12" font-weight="700">CONFIDENCE</text></g>
    <g transform="translate(492 14)"><rect width="146" height="27" rx="13.5" fill="#3a2630"/><circle cx="16" cy="13.5" r="5" fill="#ff9f7a"/><text x="28" y="18" fill="#ffe2d9" font-size="12" font-weight="700">UNCERTAIN</text></g>
    <path d="M674 27H714" stroke="#41647b" stroke-width="1.5"/>
    <text x="737" y="34" fill="#a9bdca" font-size="14">No drawing mutation occurs during understanding or grounding.</text>
  </g>
</svg>
