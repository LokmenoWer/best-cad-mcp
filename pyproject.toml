[project]
name = "best-cad-mcp"
version = "1.7.2"
description = "Comprehensive Windows AutoCAD MCP server with 300+ specialized tools for handle-first drawing, editing, understanding, validation, visual grounding, plotting, and guarded CAD automation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CAD MCP Developer"}
]
keywords = ["autocad", "mcp", "cad", "model-context-protocol", "ai", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "packaging>=24.2",
    "pywin32>=311; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pyautocad>=0.2.0; sys_platform == 'win32'",
    "typing_extensions>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/LokmenoWer/best-cad-mcp"
Repository = "https://github.com/LokmenoWer/best-cad-mcp"
Issues = "https://github.com/LokmenoWer/best-cad-mcp/issues"

[project.optional-dependencies]
visual = [
    "cairosvg>=2.7.1",
    "Pillow>=10.0",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
]

[project.scripts]
cad-mcp = "src.server:main"
cad-mcp-doctor = "src.doctor:main"

[tool.pytest.ini_options]
markers = [
    "autocad_com: tests that require a local AutoCAD COM session and should not run in GitHub Actions release publishing",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist", ".cad_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E701: compact one-line wrappers are an intentional cad_tools style.
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
# server.py intentionally imports after COM/thread bootstrap and re-exports
# the full tool surface; scripts bootstrap sys.path before project imports.
"src/server.py" = ["E402", "F401"]
"src/cad_tools/__init__.py" = ["F401"]
"src/cad_understanding/__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*"]

[tool.setuptools.package-data]
prompts = ["*.md"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"
